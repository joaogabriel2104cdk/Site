<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Roleta de Pontos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header>
            <h1>Roleta de Pontos Fictícios</h1>
            <p>Insira um valor de pontos para girar a roleta da sorte.</p>
        </header>

        <section class="painel-saldo" aria-live="polite">
            <p>Seu Saldo Atual: <strong id="saldoAtual">1000</strong> pontos</p>
        </section>

        <section class="jogo-container">
            <div class="roleta-wrapper">
                <div class="indicador" aria-hidden="true">▼</div>
                <div id="roleta" class="roleta">
                    <div class="opcao" style="--i:1;--cor:#e74c3c;"><span>X0</span></div>
                    <div class="opcao" style="--i:2;--cor:#2ecc71;"><span>X2</span></div>
                    <div class="opcao" style="--i:3;--cor:#3498db;"><span>X0.5</span></div>
                    <div class="opcao" style="--i:4;--cor:#f1c40f;"><span>X3</span></div>
                    <div class="opcao" style="--i:5;--cor:#9b59b6;"><span>X0</span></div>
                    <div class="opcao" style="--i:6;--cor:#1abc9c;"><span>X1.5</span></div>
                </div>
            </div>

            <form id="jogoForm" novalidate>
                <div class="form-group">
                    <label for="valorPontos">Quantidade de pontos para simular:</label>
                    <input 
                        type="number" 
                        id="valorPontos" 
                        min="1" 
                        required 
                        aria-required="true"
                        aria-describedby="erroPontos"
                        placeholder="Ex: 50">
                    <span class="mensagem-erro" id="erroPontos" aria-live="polite"></span>
                </div>

                <button type="submit" id="btnGirar">Girar Roleta</button>
            </form>
        </section>

        <div id="feedbackResultado" class="feedback-resultado" role="status" aria-live="polite"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
